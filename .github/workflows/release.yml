name: Release

on:
  release:
    types: [published]

jobs:
  release-zip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@0717577d45739eb3c851188b29f50ed6c0b2194e

      - name: ZIP Component Dir
        run: |
          cd ${{ github.workspace }}/custom_components/hon
          zip -r haier_hon.zip ./

      - name: Upload zip to release
        uses: svenstaro/upload-release-action@29e53e917877a24fad85510ded594ab3c9ca12de
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: ${{ github.workspace }}/custom_components/hon/haier_hon.zip
          asset_name: haier_hon.zip
          tag: ${{ github.ref }}
          overwrite: true